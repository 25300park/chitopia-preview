<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Preview – Wireframe</title>
<style>
  body{margin:0;background:#1b1b1b;color:#ddd;font-family:"Segoe UI","Malgun Gothic",sans-serif}
  .bar{display:flex;gap:12px;align-items:center;padding:10px 20px;background:#111;position:sticky;top:0;z-index:2;flex-wrap:wrap}
  .bar a{color:#9cf}
  .bar select{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;padding:4px 8px}
  .stage{display:flex;gap:32px;padding:24px;overflow-x:auto;align-items:flex-start}
  .dev{flex:none;text-align:center}
  .dev p{margin:0 0 8px;font-size:13px}
  .frame{border:10px solid #000;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .frame.tab{border-radius:18px}
  .frame.desk{border-radius:6px;border-width:6px}
  iframe{border:0;display:block;transform-origin:0 0}
</style>
</head>
<body>
<div class="bar">
  <b>📱 Device Preview</b>
  <span>Page:</span>
  <select id="pg">
    <option value="home">01 · Home</option><option value="brand">02 · Brand</option><option value="menu">03 · Menu</option>
    <option value="proof">04 · Korea Proof</option><option value="franchise">05 · Franchise</option><option value="stores">06 · Store Locator</option>
    <option value="apply">07 · Apply</option><option value="privacy">08 · Privacy</option>
  </select>
  <a href="index.html">← Back to full wireframe</a>
</div>
<div class="stage">
  <div class="dev"><p>Mobile · 390 × 844 (iPhone 14)</p><div class="frame" style="width:390px;height:844px"><iframe data-w="390" data-h="844" data-s="1"></iframe></div></div>
  <div class="dev"><p>Tablet · 768 × 1024 (75%)</p><div class="frame tab" style="width:576px;height:768px"><iframe data-w="768" data-h="1024" data-s=".75"></iframe></div></div>
  <div class="dev"><p>Desktop · 1440 × 900 (50%)</p><div class="frame desk" style="width:720px;height:450px"><iframe data-w="1440" data-h="900" data-s=".5"></iframe></div></div>
</div>
<script>
const frames = [...document.querySelectorAll('iframe')], pg = document.getElementById('pg');
frames.forEach(f => { f.width = f.dataset.w; f.height = f.dataset.h; f.style.transform = `scale(${f.dataset.s})`; });
function load(){ frames.forEach(f => f.src = 'index.html?v=' + Date.now() + '#' + pg.value); }
pg.addEventListener('change', load); load();
</script>
</body>
</html>
